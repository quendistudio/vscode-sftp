name: Feature request
description: Suggest an improvement for qSFTP
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched [existing issues](https://github.com/quendistudio/vscode-sftp/issues) for a similar request
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? (Ex. “I’m always frustrated when…”)
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you would like to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, or workarounds you use today.

  - type: dropdown
    id: priority
    attributes:
      label: How important is this for your workflow?
      options:
        - Nice to have
        - Would save time regularly
        - Blocking / I cannot use the extension without it
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, example configs (redacted), or links.
