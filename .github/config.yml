# Configuration for request-info - https://github.com/behaviorbot/request-info

requestInfoReplyComment: >
  Thanks for opening this. Could you add a bit more detail using the issue form
  fields (steps to reproduce, editor/extension versions, and Output → sftp logs
  with `sftp.debug` enabled when relevant)?

requestInfoDefaultTitles:
  - update readme.md
  - updates

requestInfoLabelToAdd: needs-more-info

checkIssueTemplate: true
checkPullRequestTemplate: true

requestInfoOn:
  pullRequest: true
  issue: true

requestInfoUserstoExclude:
  - quendistudio
